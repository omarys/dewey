[package]
name = "dewey"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "TUI manga/manhwa library manager orchestrating Continuum and Labrador"

[dependencies]
# TUI and Terminal Handling
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"

# Async Runtime & Concurrency
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
futures = "0.3"

# Database & Serialization
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# CLI, Utilities & Regex
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
natord = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
anyhow = "1.0"
thiserror = "2.0"

# Logging (file-based to avoid corrupting TUI stdout)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[profile.release]
# Low-resource / portable build: shrink binary + speed up execution.
lto = "thin"
codegen-units = 1
panic = "abort"
# Drop debug symbols: smaller binary, faster cold launch
strip = true
