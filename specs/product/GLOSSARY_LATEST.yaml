# Dewey — Glossary (Latest)

terms:
  - name: Dewey
    def: "The TUI library manager application (this repo). Orchestrates the library, Continuum, and Labrador."

  - name: Continuum
    def: "GTK4/Adwaita comic reader (.cbz). Separate repo (github.com/omarys/continuum). Spawned by dewey as a child process; emits a JSON exit payload on close."

  - name: Labrador
    def: "Async manga downloader/scraper. Separate repo. Spawned by dewey via tokio::process; returns a JSON payload with file path and discovered URLs."

  - name: Library
    def: "A directory containing series subdirectories, each with .cbz/.zip chapter archives and optional series.json metadata."

  - name: Series
    def: "A single manga/manhwa title. Maps to one subdirectory in the library. Has a SQLite row in the `series` table."

  - name: Chapter
    def: "A single .cbz/.zip archive within a series directory. Has a SQLite row in the `chapters` table with chapter_number, file_path, page_count."

  - name: Progress
    def: "Per-chapter reading state: last_page_read (1-based, clamped to page_count), is_completed, last_read_at. SQLite `progress` table, one row per chapter."

  - name: Exit payload
    def: "JSON emitted by Continuum to stdout on window close. Contains legacy top-level last_page/completed (initial chapter) and a chapters[] array (per-chapter local progress). Parsed by dewey's ContinuumExitPayload."

  - name: Multi-chapter progress
    def: "When Continuum auto-appends following chapters as the user scrolls, one session can read across multiple .cbz files. The payload enumerates each read chapter with LOCAL page numbers (never global offsets)."

  - name: Bounds clamping
    def: "upsert_progress clamps last_page_read to [0, page_count]. Defense-in-depth against payload corruption. One-time repair query clamps existing corrupted rows on every init_schema."

  - name: Per-directory database
    def: "When dewey is pointed at a library directory explicitly (dewey . or -l <dir>), the SQLite database lives at <dir>/.dewey.db. Isolates multiple libraries without config."

  - name: Empty-library guard
    def: "If an explicit library directory contains no .cbz/.zip/.epub/.pdf/.cbr archives anywhere in its tree and no database exists yet, dewey prints a skip message and exits without creating a database."

  - name: Companion runner
    def: "dewey's child-process management layer (src/runner/). ContinuumRunner uses std::process::Command (blocking, TUI suspended); LabradorRunner uses tokio::process::Command (async, non-blocking)."

  - name: Parallel scan
    def: "Library scanner uses std::thread::scope with a bounded worker pool (available_parallelism). ZIP page-count reads parallelize; DB writes serialize behind Arc<Mutex<Connection>>."

  - name: Action bar
    def: "A 1-line tappable footer row (Open/Fetch/Next/Scan/Reset/Delete/Quit) for touchscreen users. Maps mouse taps to the same handlers as keyboard shortcuts."

  - name: Portrait layout
    def: "When terminal height > width, panes stack vertically (Series/Chapters/Details) instead of side-by-side. Optimized for tablet portrait orientation."

  - name: Native build
    def: "install.sh builds with RUSTFLAGS='-C target-cpu=native' for device-specific CPU tuning. Binary is NOT portable — rebuild per machine."
