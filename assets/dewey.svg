<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f38ba8"/>
      <stop offset="100%" stop-color="#eba0ac"/>
    </linearGradient>
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9e2af"/>
      <stop offset="100%" stop-color="#fab387"/>
    </linearGradient>
  </defs>

  <!-- Base App Tile (Squircle) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#313244" stroke-width="2.5"/>

  <!-- Bookshelf Base -->
  <rect x="20" y="100" width="88" height="6" rx="3" fill="#45475a"/>

  <!-- Book 1 (Left, Spine visible) -->
  <rect x="26" y="44" width="14" height="56" rx="2" fill="url(#book1)"/>
  <rect x="28" y="50" width="10" height="4" rx="1" fill="#ffffff" opacity="0.6"/>
  <rect x="28" y="88" width="10" height="4" rx="1" fill="#ffffff" opacity="0.6"/>

  <!-- Book 2 (Middle, Tall) -->
  <rect x="44" y="32" width="16" height="68" rx="2" fill="url(#book2)"/>
  <rect x="47" y="40" width="10" height="5" rx="1" fill="#ffffff" opacity="0.6"/>
  <line x1="52" y1="52" x2="52" y2="82" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <rect x="47" y="88" width="10" height="4" rx="1" fill="#ffffff" opacity="0.6"/>

  <!-- Book 3 (Leaning Book) -->
  <g transform="translate(74, 98) rotate(18) translate(-10, -64)">
    <rect x="0" y="0" width="15" height="64" rx="2" fill="url(#book3)"/>
    <rect x="3" y="8" width="9" height="4" rx="1" fill="#ffffff" opacity="0.6"/>
    <rect x="3" y="52" width="9" height="4" rx="1" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Terminal Cursor / Star Emblem on Top Right -->
  <circle cx="96" cy="32" r="14" fill="url(#goldAcc)"/>
  <path d="M 91 27 L 97 32 L 91 37" fill="none" stroke="#11111b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="97" y1="37" x2="103" y2="37" stroke="#11111b" stroke-width="2.5" stroke-linecap="round"/>
</svg>
